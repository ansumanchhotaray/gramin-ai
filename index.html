                  <p className="text-xs text-gray-500 mt-2">
                    {lang === 'en' 
                      ? 'Assistance available for site survey, PVC tower delivery, and nutrient dosing calibration.' 
                      : 'साइट सर्वे, टावर डिलीवरी और पोषक तत्व सेटिंग में सहायता उपलब्ध है।'}
                  </p>
                </div>
                <div className="pt-2">
                  <button
                    onClick={() => setPartnerModal(null)}
                    className="w-full py-2.5 bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold rounded-xl text-xs transition-all"
                  >
                    Close / Cancel
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ================= MODAL: CALL HELPLINE ================= */}
          {callingModal && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-xs flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl max-w-sm w-full p-6 text-center space-y-4 shadow-2xl border border-red-200 animate-in fade-in zoom-in-95">
                <div className="w-16 h-16 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto animate-bounce text-2xl">
                  📞
                </div>
                <div>
                  <h4 className="text-lg font-bold text-gray-900">National Medical Helpline</h4>
                  <p className="text-2xl font-black text-red-600">108 / 102</p>
                  <p className="text-xs text-gray-500 mt-1">
                    Dialing Nearest Primary Health Centre & Emergency Ambulance Unit...
                  </p>
                </div>
                <div className="pt-2">
                  <button
                    onClick={() => setCallingModal(false)}
                    className="w-full py-2.5 bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold rounded-xl text-sm"
                  >
                    Close / Cancel
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ================= DESKTOP FOOTER ================= */}
          <footer className="bg-white border-t border-gray-200/80 py-4 mt-8 text-center text-xs text-gray-600 font-medium">
            <div className="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-2">
              <span>Digital Rural Assist Node • Designed for visual clarity, voice-first navigation, and offline access</span>
              <span className="text-gray-600">GraminAI • Amaravati Edition v6.0</span>
            </div>
          </footer>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<GraminAIDashboard />);
  </script>
</body>
</html>
